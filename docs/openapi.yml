openapi: 3.0.0
info:
  title: MediAgent API
  description: Hackathon backend for Amazon Nova lab data extraction and agentic chat.
  version: 1.1.0
servers:
  - url: https://lyszq8emp5.execute-api.us-east-1.amazonaws.com/prod
    description: Production API Gateway
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
paths:
  /reports/upload-url:
    get:
      summary: Retrieve a pre-signed S3 URL for uploading large report images directly.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
          description: The ID of the patient.
      responses:
        '200':
          description: A payload containing the pre-signed S3 `url` and the associated `s3Key`.
  /reports/upload:
    post:
      summary: Trigger Amazon Nova extraction on the previously uploaded S3 image.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - reportType
                - s3Key
              properties:
                patientId:
                  type: string
                  example: "patient-demo-001"
                reportType:
                  type: string
                  example: "lab_report"
                s3Key:
                  type: string
                  description: "The S3 key target that the mobile app uploaded the binary to."
      responses:
        '200':
          description: Successfully parsed and stored the report.
  /reports:
    get:
      summary: Retrieve all reports for a specific patient
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of FHIR DiagnosticReports.
  /observations:
    get:
      summary: Retrieve all observations for a specific patient for UI Graph plotting.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: patientId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of FHIR Observations containing `value`, `date`, `normalLow`, `normalHigh` (for rendering bands), and `isAbnormal` boolean alerts.
  /chat:
    post:
      summary: Chat with the Bedrock Agent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patientId
                - message
                - conversationHistory
              properties:
                patientId:
                  type: string
                  example: "patient-demo-001"
                message:
                  type: string
                  example: "What is my glucose trend?"
                conversationHistory:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          description: Response from the LLM agent, containing `referencedReports` or `referencedObservations` arrays for UI Citations.

  /families:
    post:
      summary: Create a new family.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "The Miller Family"
      responses:
        '201':
          description: Family created successfully. Returns the `familyId`.

  /families/{familyId}/members:
    post:
      summary: Register a new member to a family.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Alice Miller"
                id:
                  type: string
                  description: Optional ID (UUID).
      responses:
        '201':
          description: Member added successfully. Returns `memberId`.
    get:
      summary: List all members of a family.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of family members.
