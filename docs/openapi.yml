openapi: 3.0.0
info:
  title: MediAgent API
  description: Hackathon backend for Amazon Nova lab data extraction and agentic chat. Features strictly hierarchical REST paths and multi-turn AI context sessions.
  version: 2.1.0
servers:
  - url: https://lyszq8emp5.execute-api.us-east-1.amazonaws.com/prod
    description: Production API Gateway
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Meta:
      type: object
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedBy: { type: string }
        version: { type: integer }
        isDeleted: { type: boolean }
paths:
  /families:
    get:
      summary: List all families.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of families.
    post:
      summary: Create a new family.
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '201':
          description: Family created.

  /families/{familyId}/members:
    get:
      summary: List members of a family.
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of members.
    post:
      summary: Add a member to a family.
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                age: { type: integer }
                gender: { type: string }
                relationship: { type: string }
      responses:
        '201':
          description: Member added.

  /families/{familyId}/members/{memberId}/reports/upload-url:
    get:
      summary: Retrieve a pre-signed S3 URL for uploading report images or documents.
      description: Supports image/jpeg, image/png, image/webp, and application/pdf.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: query
          name: contentType
          required: false
          schema: { type: string, default: "image/jpeg" }
      responses:
        '200':
          description: Presigned S3 URL, reportId, and s3Key.

  /families/{familyId}/members/{memberId}/reports/upload:
    post:
      summary: Trigger manual processing of an uploaded file.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key: { type: string }
                reportType: { type: string, default: "lab_report" }
      responses:
        '200':
          description: Processing started.

  /families/{familyId}/members/{memberId}/reports:
    get:
      summary: Retrieve all reports for a specific member.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of reports.

  /families/{familyId}/members/{memberId}/reports/{reportId}/status:
    get:
      summary: Check extraction status and summary.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Report status info and extracted observations.

  /families/{familyId}/members/{memberId}/reports/{reportId}/download:
    get:
      summary: Get a pre-signed URL to download/view the original file.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Download URL.

  /families/{familyId}/members/{memberId}/reports/{reportId}:
    delete:
      summary: Soft-delete a report and all its associated observations.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted successfully.

  /families/{familyId}/members/{memberId}/observations:
    get:
      summary: Retrieve all observations for a specific member across all reports.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of observations.

  /families/{familyId}/members/{memberId}/insights:
    get:
      summary: Retrieve insights for a specific member.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of insights.

  /families/{familyId}/members/{memberId}/insights/generate:
    post:
      summary: On-demand generation of insights using Amazon Nova.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Insights generated.

  /families/{familyId}/members/{memberId}/followups:
    get:
      summary: Retrieve follow-up recommendations for a specific member.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, all]
            default: pending
          description: Filter follow-ups by status. Use 'all' to retrieve both pending and completed.
      responses:
        '200':
          description: List of follow-ups.

  /families/{familyId}/members/{memberId}/followups/{followUpId}:
    patch:
      summary: Update the status of a specific follow-up.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
        - in: path
          name: followUpId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suggestedDate]
              properties:
                status:
                  type: string
                  enum: [pending, completed, dismissed]
                suggestedDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Follow-up updated successfully.

  /families/{familyId}/members/{memberId}/chat:
    post:
      summary: Chat with the Bedrock Agent for a specific member.
      description: Maintains multi-turn context using the sessionId field.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: familyId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                sessionId: { type: string, description: "Pass a previously received sessionId to maintain conversation context." }
      responses:
        '200':
          description: AI response and persistent sessionId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  sessionId: { type: string }
